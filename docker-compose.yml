name: saksi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saksi
    ports:
      - "5432:5432"
    volumes:
      - saksi_postgres_data:/var/lib/postgresql/data
      # Hanya jalan saat volume kosong. Skema nyata = SAKSI.sql (schema.sql lama tidak cocok dengan kode store).
      - ./backend/scripts/compat_datetime.sql:/docker-entrypoint-initdb.d/00_compat_datetime.sql
      - ./backend/scripts/SAKSI.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/scripts/seed_villages.sql:/docker-entrypoint-initdb.d/02_seed_villages.sql
      - ./backend/scripts/seed_demo.sql:/docker-entrypoint-initdb.d/03_seed_demo.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saksi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache dan rate limit backend. Hanya untuk jaringan compose (port tidak dipublikasikan);
  # akses manual: docker compose exec redis redis-cli. Cache bisa dibuang, jadi tanpa persistensi.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: saksi-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SAKSI_SECRET=saksi-development-secret-key-min16chars
      # development/local/test: token reset sandi ikut di respons dan log (belum ada email). Jangan dipakai di produksi.
      - APP_ENV=development
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/saksi?sslmode=disable
      - STORAGE_DIR=/data/files
      # REST tetap sebagai cadangan selama gRPC belum terbukti di Azure.
      - AI_ENGINE_URL=http://ai-engine:8000
      - AI_ENGINE_GRPC_ADDR=ai-engine:50051
      # Kosongkan REDIS_URL untuk mematikan cache (aplikasi tetap jalan).
      - REDIS_URL=redis://redis:6379/0
      - AI_API_KEY=${AI_API_KEY:-saksi-dev-ai-key}
      - WEB_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - saksi_storage_data:/data/files

  ai-engine:
    build: ./ai-engine
    image: saksi-ai-engine
    restart: unless-stopped
    # Hanya untuk akses lokal; di produksi cukup lewat jaringan internal compose.
    ports:
      - "127.0.0.1:8000:8000"
    # GROQ_API_KEY, GEMINI_API_KEY, AI_PROVIDERS dibaca dari ai-engine/.env.
    env_file:
      - path: ./ai-engine/.env
        required: false
    # gRPC (GRPC_PORT) hanya untuk jaringan compose. Untuk tes lokal dengan grpcurl,
    # tambahkan "127.0.0.1:50051:50051" ke ports; jangan publikasikan ke 0.0.0.0.
    expose:
      - "50051"
    environment:
      # Ditimpa di sini agar selalu sama dengan kunci yang dipakai backend.
      - AI_API_KEY=${AI_API_KEY:-saksi-dev-ai-key}
      - GRPC_PORT=50051

volumes:
  saksi_postgres_data:
  saksi_storage_data:
